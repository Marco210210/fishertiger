services:
  - type: web
    name: fishertiger-marco
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: FISHERTIGER_USERNAME
        sync: false
      - key: FISHERTIGER_PASSWORD
        sync: false
      - key: FISHERTIGER_AUTH_FILE
        value: /var/data/users.json
