name: Update official Fantacalcio data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install beautifulsoup4 pandas
      - run: python -m scripts.update_official_data
      - name: Commit changed public data
        run: |
          if git diff --quiet -- data/raw/fantacalcio_2026_27.json; then
            echo "Official data are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/fantacalcio_2026_27.json
          git commit -m "Update official Fantacalcio data"
          git push
