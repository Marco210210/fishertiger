services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "10000"
      FISHERTIGER_USERNAME: "${FISHERTIGER_USERNAME}"
      FISHERTIGER_PASSWORD: "${FISHERTIGER_PASSWORD}"
      FISHERTIGER_FANTALAB_TOKEN: "${FISHERTIGER_FANTALAB_TOKEN:-}"
    volumes:
      - ./runtime:/var/data
    expose:
      - "10000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
